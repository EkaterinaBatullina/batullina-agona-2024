databaseChangeLog:
  - changeSet:
      id: 3
      author: Ekaterina Batullina
      changes:
        - insert:
            tableName: user
            columns:
              - column:
                  name: name
                  value: 'name'
              - column:
                  name: email
                  value: 'admin@example.com'

        - insert:
            tableName: role
            columns:
              - column:
                  name: name
                  value: 'ADMIN'
              - column:
                  name: description
                  value: 'Administrator role with full privileges'

        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO user_role (user_id, role_id)
              SELECT id, 
                     (SELECT id FROM role WHERE name = 'ADMIN' LIMIT 1)
              FROM "user" 
              WHERE name = 'name' LIMIT 1;
