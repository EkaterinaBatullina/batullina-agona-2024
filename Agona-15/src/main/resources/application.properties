spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=test-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.starship-value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.starship-trusted-packages=org.example.dto
spring.kafka.consumer.starship-default-type=org.example.dto.StarshipDto
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.starship-enable-auto-commit=false

spring.kafka.producer.client-id=test-producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.LongSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.starship-value-serializer=org.springframework.kafka.support.serializer.JsonSerializer