version: '3.8'

services:
  consul:
    image: consul:1.15
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: "agent -dev -client=0.0.0.0"
    
  client-service:
    build:
      context: ./client-service/client-service-impl
    ports:
      - "8081:8080"
    
  user-service:
    build:
      context: ./user-service/user-service-impl
    ports:
      - "9091:9090"