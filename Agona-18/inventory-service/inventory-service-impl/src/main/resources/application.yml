spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      payment-succeeded-event-value-deserializer: org.apache.kafka.common.serialization.JsonDeserializer
      trusted-packages: com.technokratos.event
      payment-succeeded-event-default-type: com.technokratos.event.PaymentSucceededEvent
      enable-auto-commit: true
    producer:
      client-id: test-producer
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      inventory-reserved-event-value-serializer: org.apache.kafka.common.serialization.JsonSerializer
      inventory-failed-event-value-serializer: org.springframework.kafka.support.serializer.JsonSerializer